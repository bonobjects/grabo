<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>UNIGORN AR CUSTOM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    /* 基本設定 - ピンチ操作のためデフォルトのズームを禁止 */
    * { 
      box-sizing: border-box; 
      touch-action: none; 
    }
    
    body { 
      margin: 0; 
      background: #0b1418; 
      font-family: 'Segoe UI', sans-serif; 
      color: #6fffe9; 
      display: flex; 
      justify-content: center; 
      padding: 10px; 
      overflow-x: hidden; 
    }
    
    .app { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      width: 100%; 
      max-width: 400px; 
    }
    
    .title { 
      font-size: 18px; 
      margin: 10px 0; 
      text-align: center; 
      color: #fff; 
      text-shadow: 0 0 5px #2dd4bf; 
      letter-spacing: 2px; 
      font-weight: 900; 
      text-transform: uppercase; 
    }
    
    /* キャンバスコンテナ */
    .canvas-wrap { 
      width: 100%; 
      aspect-ratio: 1 / 1; 
      border: 3px solid #2dd4bf; 
      margin-bottom: 10px; 
      background: #000; 
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.3); 
      position: relative; 
      overflow: hidden;
    }
    
    canvas { 
      width: 100%; 
      height: 100%; 
      display: block; 
    }

    /* コントロール要素 */
    .controls { 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    
    .passcode-form { 
      display: flex; 
      width: 100%; 
      gap: 5px; 
      margin-bottom: 10px; 
    }
    
    input[type="text"] { 
      flex: 1; 
      background: #000; 
      border: 1px solid #2dd4bf; 
      color: #6fffe9; 
      padding: 12px; 
      text-align: center; 
      font-size: 14px; 
      border-radius: 0; 
    }
    
    .unlock-btn { 
      width: 80px; 
      background: #2dd4bf; 
      color: #002b2b; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
    }

    /* アコーディオンメニュー */
    .accordion-item {
      width: 100%;
      margin-bottom: 4px;
    }

    .accordion-header {
      display: none; /* 初期は非表示（RANDOM 5回で表示） */
      width: 100%;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid #2dd4bf;
      color: #6fffe9;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      position: relative;
      transition: background 0.2s;
    }

    .accordion-header:hover {
      background: rgba(45, 212, 191, 0.2);
    }

    .accordion-header::after {
      content: '▼';
      position: absolute;
      right: 10px;
      font-size: 10px;
      transition: transform 0.3s;
    }

    .accordion-header.active::after {
      transform: rotate(180deg);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #2dd4bf;
      border-top: none;
    }

    .accordion-content.active {
      max-height: 150px;
    }

    /* カテゴリ切り替えボタン */
    .category-item {
      width: 100%;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid #2dd4bf;
      color: #6fffe9;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
      transition: all 0.2s;
      position: relative;
    }

    .category-item:hover {
      background: rgba(45, 212, 191, 0.2);
    }

    .category-item::after {
      content: attr(data-current);
      position: absolute;
      right: 10px;
      font-size: 10px;
      opacity: 0.7;
    }

    /* リミテッドカテゴリ用スタイル */
    .accordion-item.limited .accordion-header {
      border-color: #ff00ff;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
      background: rgba(255, 0, 255, 0.1);
    }

    .accordion-item.limited .accordion-content {
      border-color: #ff00ff;
    }

    .accordion-item.limited .category-item {
      border-color: #ff00ff;
      color: #ff00ff;
    }

    /* 機能ボタン */
    .buttons { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      width: 100%; 
      margin-top: 8px;
    }
    
    button { 
      flex: 1; 
      min-width: 45%; 
      background: #2dd4bf; 
      color: #002b2b; 
      border: none; 
      padding: 15px 5px; 
      font-size: 11px; 
      font-weight: bold; 
      cursor: pointer; 
      text-transform: uppercase; 
    }
    
    #arBtn { 
      background: #ff00ff; 
      color: #fff; 
    }
    
    #downloadBtn { 
      flex-basis: 100%; 
      background: #fff; 
      color: #000; 
    }

    /* ボーナスモードのアニメーション */
    .bonus-mode .app { 
      animation: glitch 0.15s infinite; 
    }
    
    @keyframes glitch { 
      0% { transform: translate(0); } 
      25% { transform: translate(-1px, 1px); } 
      50% { transform: translate(1px, -1px); } 
      100% { transform: translate(0); } 
    }
    
    /* フラッシュエフェクト */
    .flash-overlay { 
      position: fixed; 
      inset: 0; 
      background: white; 
      z-index: 9999; 
      pointer-events: none; 
      opacity: 0; 
    }
  </style>
</head>
<body>

<!-- フラッシュエフェクト用オーバーレイ -->
<div class="flash-overlay" id="flash"></div>

<!-- AR用ビデオ要素（非表示） -->
<video id="video" autoplay playsinline style="display:none;"></video>

<!-- メインアプリケーション -->
<div class="app" id="app">
  <h1 class="title">UNIGORN AR CUSTOM</h1>

  <!-- キャンバス表示エリア -->
  <div class="canvas-wrap" id="canvasContainer">
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>

  <!-- コントロールパネル -->
  <div class="controls">
    <!-- パスコード入力フォーム -->
    <div class="passcode-form" id="passForm">
      <input type="text" id="passInput" placeholder="CODE HERE" maxlength="10">
      <button class="unlock-btn" id="unlockBtn">OK</button>
    </div>

    <!-- カスタマイズメニュー（4つのカテゴリを統合） -->
    <div class="accordion-item" id="customizeMenu">
      <div class="accordion-header">📝 CUSTOMIZE PARTS</div>
      <div class="accordion-content">
        <div class="category-item" data-part="background" data-current="0/5">CHANGE BG</div>
        <div class="category-item" data-part="body" data-current="0/5">BODY</div>
        <div class="category-item" data-part="face" data-current="0/3">FACE</div>
        <div class="category-item" data-part="head" data-current="0/4">HEAD</div>
      </div>
    </div>

    <!-- リミテッドメニュー（別項目） -->
    <div class="accordion-item limited" id="limitedMenu" style="display: none;">
      <div class="accordion-header">⚠️ LIMITED ⚠️</div>
      <div class="accordion-content">
        <div class="category-item" data-part="limited" data-current="0/0">LIMITED PARTS</div>
      </div>
    </div>

    <!-- 機能ボタン群 -->
    <div class="buttons">
      <button id="randomBtn">RANDOM (<span id="count">0</span>/5)</button>
      <button id="arBtn">START AR</button>
      <button id="downloadBtn">SAVE ICON</button>
    </div>
    
    <!-- 操作説明 -->
    <p style="font-size: 10px; text-align: center; margin: 5px 0;">※ピンチ操作でキャラクターを拡大縮小</p>
  </div>
</div>

<script>
  // ========================================
  // DOM要素の取得
  // ========================================
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const video = document.getElementById("video");
  const app = document.getElementById("app");
  const flash = document.getElementById("flash");
  const passInput = document.getElementById("passInput");

  // ========================================
  // パーツ設定
  // ========================================
  const parts = { 
    background: 6, 
    body: 6, 
    face: 4, 
    head: 5, 
    limited: 1 
  };
  
  const order = ["background", "body", "face", "head", "limited"];
  
  const state = { 
    background: 0, 
    body: 0, 
    face: 0, 
    head: 0, 
    limited: 0, 
    scale: 1.0 
  };
  
  let arMode = false;
  const CORRECT_PASS = "xxxxw"; 

  // ========================================
  // ピンチ操作ロジック（拡大縮小）
  // ========================================
  let initialDist = null;
  let currentScale = 1.0;

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      initialDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX, 
        e.touches[0].pageY - e.touches[1].pageY
      );
    }
  });

  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && initialDist) {
      const dist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX, 
        e.touches[0].pageY - e.touches[1].pageY
      );
      const zoom = dist / initialDist;
      state.scale = Math.min(Math.max(currentScale * zoom, 0.5), 3.0);
      if (arMode) draw();
    }
  });

  canvas.addEventListener("touchend", () => {
    initialDist = null;
    currentScale = state.scale;
  });

  // ========================================
  // 画像読み込みと描画ロジック
  // ========================================
  const imgCache = {};
  
  function getPartImage(part, index) {
    const key = `${part}${index}`;
    if (!imgCache[key]) {
      imgCache[key] = new Image();
      imgCache[key].src = `./images/${part}${index}.png`;
    }
    return imgCache[key];
  }

  function draw() {
    ctx.clearRect(0, 0, 512, 512);

    // 1. 背景描画
    if (arMode && video.readyState >= 2) {
      const size = Math.min(video.videoWidth, video.videoHeight);
      const sx = (video.videoWidth - size) / 2;
      const sy = (video.videoHeight - size) / 2;
      ctx.drawImage(video, sx, sy, size, size, 0, 0, 512, 512);
    } else if (!arMode) {
      const bgImg = getPartImage('background', state.background);
      ctx.drawImage(bgImg, 0, 0, 512, 512);
    }

    // 2. キャラクターパーツ描画
    ctx.save();
    ctx.translate(256, 256);
    ctx.scale(state.scale, state.scale);
    ctx.translate(-256, -256);

    for (const part of order) {
      if (part === 'background') continue;
      if (part === 'limited') {
        const limitedMenu = document.getElementById('limitedMenu');
        if (limitedMenu.style.display === 'none') continue;
      }
      
      const img = getPartImage(part, state[part]);
      if (img.complete) {
        ctx.drawImage(img, 0, 0, 512, 512);
      }
    }
    
    ctx.restore();

    if (arMode) requestAnimationFrame(draw);
  }

  // ========================================
  // カテゴリ切り替え表示を更新
  // ========================================
  function updateCategoryDisplay(part) {
    const item = document.querySelector(`[data-part="${part}"]`);
    if (item) {
      const max = parts[part] - 1;
      item.setAttribute('data-current', `${state[part]}/${max}`);
    }
  }

  // ========================================
  // カテゴリアイテムのクリックイベント
  // ========================================
  function initCategoryItems() {
    document.querySelectorAll('.category-item').forEach(item => {
      item.addEventListener('click', () => {
        const part = item.dataset.part;
        
        // 次の画像に切り替え（最後まで行ったら0に戻る）
        state[part] = (state[part] + 1) % parts[part];
        
        // 表示を更新
        updateCategoryDisplay(part);
        
        // 再描画
        if (!arMode) draw();
      });
    });
  }

  // ========================================
  // アコーディオン機能
  // ========================================
  function initAccordion() {
    document.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        const isActive = header.classList.contains('active');

        // すべてのアコーディオンを閉じる
        document.querySelectorAll('.accordion-header').forEach(h => {
          h.classList.remove('active');
          h.nextElementSibling.classList.remove('active');
        });

        // クリックされたものだけ開く
        if (!isActive) {
          header.classList.add('active');
          content.classList.add('active');
        }
      });
    });
  }

  // ========================================
  // ARモード切り替え
  // ========================================
  document.getElementById("arBtn").addEventListener("click", async function() {
    try {
      if (!arMode) {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" } 
        });
        video.srcObject = stream;
        arMode = true;
        this.innerText = "EXIT AR";
        draw();
      } else {
        const stream = video.srcObject;
        stream.getTracks().forEach(track => track.stop());
        arMode = false;
        this.innerText = "START AR";
        draw();
      }
    } catch (err) {
      alert("カメラを起動できません（HTTPS環境が必要です）");
    }
  });

  // ========================================
  // ランダム生成ボタン
  // ========================================
  document.getElementById("randomBtn").addEventListener("click", () => {
    let countEl = document.getElementById("count");
    let count = parseInt(countEl.innerText);
    
    if (count < 5) {
      countEl.innerText = ++count;
    }
    
    // 5回達成でメニュー表示
    if (count === 5) {
      app.classList.add("bonus-mode");
      document.querySelectorAll('.accordion-header').forEach(el => {
        el.style.display = 'block';
      });
    }
    
    // 全パーツをランダムに変更
    Object.keys(parts).forEach(p => {
      const limitedMenu = document.getElementById('limitedMenu');
      if (p !== 'limited' || limitedMenu.style.display !== 'none') {
        state[p] = Math.floor(Math.random() * parts[p]);
        updateCategoryDisplay(p);
      }
    });
    
    if (!arMode) draw();
  });

  // ========================================
  // パスコード入力でリミテッド解除
  // ========================================
  document.getElementById("unlockBtn").addEventListener("click", () => {
    if (passInput.value.toLowerCase() === CORRECT_PASS) {
      flash.style.opacity = "1";
      
      // リミテッドメニューを表示
      const limitedMenu = document.getElementById('limitedMenu');
      limitedMenu.style.display = 'block';
      limitedMenu.querySelector('.accordion-header').style.display = 'block';
      
      document.getElementById("passForm").style.display = "none";
      
      setTimeout(() => { 
        flash.style.opacity = "0"; 
        flash.style.transition = "opacity 0.8s"; 
      }, 50);
      
      if (!arMode) draw();
    }
  });

  // ========================================
  // 画像ダウンロードボタン
  // ========================================
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "unigorn_ar.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  // ========================================
  // 初期化
  // ========================================
  window.onload = () => {
    initCategoryItems();
    initAccordion();
    draw();
  };
</script>
</body>
</html>
