<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GRABO ICON COMPOSER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    /* ピンチ操作はcanvasのみに限定（全体へのtouch-action:noneを廃止） */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b1418;
      font-family: 'Segoe UI', sans-serif;
      color: #6fffe9;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    /* ========================================
       スティッキーヘッダー：タイトル＋キャンバスを
       スクロールしても画面上部に固定
    ======================================== */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: #0b1418;
      padding: 6px 10px 4px;
      border-bottom: 1px solid rgba(45, 212, 191, 0.3);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .title {
      font-size: 16px;
      margin: 0 0 6px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 5px #2dd4bf;
      letter-spacing: 2px;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* スクロール可能なコントロールエリア */
    .scroll-area {
      width: 100%;
      padding: 10px;
    }

    /* キャンバスコンテナ */
    .canvas-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 3px solid #2dd4bf;
      margin-bottom: 0;
      background: #000;
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.3);
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none; /* ピンチ操作はcanvasのみ */
    }

    /* ローディングオーバーレイ */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #2dd4bf;
      font-size: 12px;
      gap: 10px;
    }

    #loadingBar {
      width: 70%;
      height: 4px;
      background: #1a3a3a;
    }

    #loadingBarFill {
      height: 100%;
      width: 0%;
      background: #2dd4bf;
      transition: width 0.1s;
    }

    /* コントロール要素 */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .passcode-form {
      display: flex;
      width: 100%;
      gap: 5px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid #2dd4bf;
      color: #6fffe9;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      border-radius: 0;
    }

    .unlock-btn {
      width: 80px;
      background: #2dd4bf;
      color: #002b2b;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* アコーディオンメニュー */
    .accordion-item { width: 100%; margin-bottom: 4px; }

    .accordion-header {
      display: none;
      width: 100%;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid #2dd4bf;
      color: #6fffe9;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      position: relative;
      transition: background 0.2s;
    }

    .accordion-header:hover { background: rgba(45, 212, 191, 0.2); }

    .accordion-header::after {
      content: '▼';
      position: absolute;
      right: 10px;
      font-size: 10px;
      transition: transform 0.3s;
    }

    .accordion-header.active::after { transform: rotate(180deg); }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #2dd4bf;
      border-top: none;
    }

    .accordion-content.active { max-height: 150px; }

    /* カテゴリ切り替えボタン */
    .category-item {
      width: 100%;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid #2dd4bf;
      color: #6fffe9;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
      transition: all 0.2s;
      position: relative;
    }

    .category-item:hover { background: rgba(45, 212, 191, 0.2); }

    .category-item::after {
      content: attr(data-current);
      position: absolute;
      right: 10px;
      font-size: 10px;
      opacity: 0.7;
    }

    /* リミテッドカテゴリ用スタイル */
    .accordion-item.limited .accordion-header {
      border-color: #ff00ff;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
      background: rgba(255, 0, 255, 0.1);
    }

    .accordion-item.limited .accordion-content { border-color: #ff00ff; }
    .accordion-item.limited .category-item { border-color: #ff00ff; color: #ff00ff; }

    /* 機能ボタン */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    button {
      flex: 1;
      min-width: 45%;
      background: #2dd4bf;
      color: #002b2b;
      border: none;
      padding: 15px 5px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    #arBtn { background: #ff00ff; color: #fff; }
    #downloadBtn { flex-basis: 100%; background: #fff; color: #000; }

    /* ボーナスモードのアニメーション */
    .bonus-mode .app { animation: glitch 0.15s infinite; }

    @keyframes glitch {
      0%   { transform: translate(0); }
      25%  { transform: translate(-1px, 1px); }
      50%  { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    /* フラッシュエフェクト */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="flash-overlay" id="flash"></div>
<video id="video" autoplay playsinline style="display:none;"></video>

<div class="app" id="app">

  <!-- ===== 固定エリア：スクロールしても常に表示 ===== -->
  <div class="sticky-top">
    <h1 class="title">GRABO ICON COMPOSER</h1>
    <div class="canvas-wrap" id="canvasContainer">
      <canvas id="canvas" width="512" height="512"></canvas>
      <div id="loadingOverlay">
        <div>LOADING...</div>
        <div id="loadingBar"><div id="loadingBarFill"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== スクロールエリア：コントロールパネル ===== -->
  <div class="scroll-area">
    <div class="controls">
      <div class="passcode-form" id="passForm">
        <input type="text" id="passInput" placeholder="CODE HERE" maxlength="10">
        <button class="unlock-btn" id="unlockBtn">OK</button>
      </div>

      <div class="accordion-item" id="customizeMenu">
        <div class="accordion-header">📝 CUSTOMIZE PARTS</div>
        <div class="accordion-content">
          <div class="category-item" data-part="background" data-current="0/5">CHANGE BG</div>
          <div class="category-item" data-part="body" data-current="0/5">BODY</div>
          <div class="category-item" data-part="face" data-current="0/3">FACE</div>
          <div class="category-item" data-part="head" data-current="0/4">HEAD</div>
        </div>
      </div>

      <div class="accordion-item limited" id="limitedMenu" style="display: none;">
        <div class="accordion-header">⚠️ LIMITED ⚠️</div>
        <div class="accordion-content">
          <div class="category-item" data-part="limited" data-current="0/0">LIMITED PARTS</div>
        </div>
      </div>

      <div class="buttons">
        <button id="randomBtn">RANDOM (<span id="count">0</span>/5)</button>
        <button id="arBtn">START AR</button>
        <button id="downloadBtn">SAVE ICON</button>
      </div>

      <p style="font-size: 10px; text-align: center; margin: 5px 0;">※ピンチ操作でキャラクターを拡大縮小</p>
    </div>
  </div>

</div>

<script>
  // ========================================
  // DOM要素の取得
  // ========================================
  const canvas  = document.getElementById("canvas");
  const ctx     = canvas.getContext("2d");
  const video   = document.getElementById("video");
  const app     = document.getElementById("app");
  const flash   = document.getElementById("flash");
  const passInput = document.getElementById("passInput");
  const loadingOverlay  = document.getElementById("loadingOverlay");
  const loadingBarFill  = document.getElementById("loadingBarFill");

  // ========================================
  // パーツ設定
  // ========================================
  const parts = { background: 6, body: 6, face: 4, head: 5, limited: 1 };
  const order = ["background", "body", "face", "head", "limited"];

  const state = { background: 0, body: 0, face: 0, head: 0, limited: 0, scale: 1.0 };

  let arMode      = false;
  let arRafId     = null;     // ARアニメーションループのID
  let isDirty     = true;     // 非ARモード：再描画フラグ
  const CORRECT_PASS = "xxxxw";

  // ========================================
  // 【改善①】全画像を起動時にプリロード
  // ========================================
  const imgCache = {};

  function preloadAllImages() {
    const allKeys = [];
    for (const [part, count] of Object.entries(parts)) {
      for (let i = 0; i < count; i++) {
        allKeys.push({ part, index: i });
      }
    }

    let loaded = 0;
    const total = allKeys.length;

    return new Promise((resolve) => {
      if (total === 0) { resolve(); return; }

      allKeys.forEach(({ part, index }) => {
        const key = `${part}${index}`;
        const img = new Image();
        img.onload = img.onerror = () => {
          loaded++;
          loadingBarFill.style.width = `${(loaded / total) * 100}%`;
          if (loaded === total) resolve();
        };
        img.src = `./images/${part}${index}.png`;
        imgCache[key] = img;
      });
    });
  }

  function getPartImage(part, index) {
    return imgCache[`${part}${index}`];
  }

  // ========================================
  // 描画ロジック
  // ========================================
  function drawFrame() {
    ctx.clearRect(0, 0, 512, 512);

    // 背景
    if (arMode && video.readyState >= 2) {
      const size = Math.min(video.videoWidth, video.videoHeight);
      const sx = (video.videoWidth  - size) / 2;
      const sy = (video.videoHeight - size) / 2;
      ctx.drawImage(video, sx, sy, size, size, 0, 0, 512, 512);
    } else if (!arMode) {
      const bgImg = getPartImage('background', state.background);
      if (bgImg && bgImg.complete) ctx.drawImage(bgImg, 0, 0, 512, 512);
    }

    // キャラクターパーツ
    ctx.save();
    ctx.translate(256, 256);
    ctx.scale(state.scale, state.scale);
    ctx.translate(-256, -256);

    const limitedVisible = document.getElementById('limitedMenu').style.display !== 'none';

    for (const part of order) {
      if (part === 'background') continue;
      if (part === 'limited' && !limitedVisible) continue;

      const img = getPartImage(part, state[part]);
      if (img && img.complete) ctx.drawImage(img, 0, 0, 512, 512);
    }

    ctx.restore();
  }

  // ========================================
  // 【改善②】ARループ最適化
  //   - 非ARモード：isDirty フラグで必要な時だけ描画
  //   - ARモード：requestAnimationFrame ループ（差分描画）
  // ========================================
  function requestDraw() {
    if (arMode) return; // ARモードはループ側で処理
    isDirty = true;
  }

  // 非ARモード用：rAFで isDirty チェック
  function staticLoop() {
    if (isDirty) {
      drawFrame();
      isDirty = false;
    }
    requestAnimationFrame(staticLoop);
  }

  // ARモード用ループ（毎フレーム描画）
  function arLoop() {
    drawFrame();
    arRafId = requestAnimationFrame(arLoop);
  }

  // ========================================
  // 【改善③】ピンチ操作（canvasのみに限定）
  // ========================================
  let initialDist  = null;
  let currentScale = 1.0;

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      initialDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && initialDist) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      state.scale = Math.min(Math.max(currentScale * (dist / initialDist), 0.5), 3.0);
      requestDraw();
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => {
    initialDist  = null;
    currentScale = state.scale;
  });

  // ========================================
  // カテゴリ表示更新
  // ========================================
  function updateCategoryDisplay(part) {
    const item = document.querySelector(`[data-part="${part}"]`);
    if (item) {
      item.setAttribute('data-current', `${state[part]}/${parts[part] - 1}`);
    }
  }

  // ========================================
  // カテゴリアイテムのクリックイベント
  // ========================================
  function initCategoryItems() {
    document.querySelectorAll('.category-item').forEach(item => {
      item.addEventListener('click', () => {
        const part = item.dataset.part;
        state[part] = (state[part] + 1) % parts[part];
        updateCategoryDisplay(part);
        requestDraw();
      });
    });
  }

  // ========================================
  // アコーディオン機能
  // ========================================
  function initAccordion() {
    document.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const content  = header.nextElementSibling;
        const isActive = header.classList.contains('active');

        document.querySelectorAll('.accordion-header').forEach(h => {
          h.classList.remove('active');
          h.nextElementSibling.classList.remove('active');
        });

        if (!isActive) {
          header.classList.add('active');
          content.classList.add('active');
        }
      });
    });
  }

  // ========================================
  // ARモード切り替え
  // ========================================
  document.getElementById("arBtn").addEventListener("click", async function () {
    try {
      if (!arMode) {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        arMode = true;
        this.innerText = "EXIT AR";
        arRafId = requestAnimationFrame(arLoop);
      } else {
        cancelAnimationFrame(arRafId);
        arRafId = null;
        video.srcObject.getTracks().forEach(t => t.stop());
        arMode = false;
        this.innerText = "START AR";
        requestDraw();
      }
    } catch (err) {
      alert("カメラを起動できません（HTTPS環境が必要です）");
    }
  });

  // ========================================
  // ランダム生成ボタン
  // ========================================
  document.getElementById("randomBtn").addEventListener("click", () => {
    const countEl = document.getElementById("count");
    let count = parseInt(countEl.innerText);

    if (count < 5) countEl.innerText = ++count;

    if (count === 5) {
      app.classList.add("bonus-mode");
      document.querySelectorAll('.accordion-header').forEach(el => {
        el.style.display = 'block';
      });
    }

    const limitedVisible = document.getElementById('limitedMenu').style.display !== 'none';
    Object.keys(parts).forEach(p => {
      if (p !== 'limited' || limitedVisible) {
        state[p] = Math.floor(Math.random() * parts[p]);
        updateCategoryDisplay(p);
      }
    });

    requestDraw();
  });

  // ========================================
  // パスコード入力でリミテッド解除
  // ========================================
  document.getElementById("unlockBtn").addEventListener("click", () => {
    if (passInput.value.toLowerCase() === CORRECT_PASS) {
      flash.style.transition = "";
      flash.style.opacity    = "1";

      const limitedMenu = document.getElementById('limitedMenu');
      limitedMenu.style.display = 'block';
      limitedMenu.querySelector('.accordion-header').style.display = 'block';

      document.getElementById("passForm").style.display = "none";

      setTimeout(() => {
        flash.style.transition = "opacity 0.8s";
        flash.style.opacity    = "0";
      }, 50);

      requestDraw();
    }
  });

  // パスコード：Enterキー対応
  passInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("unlockBtn").click();
  });

  // ========================================
  // 画像ダウンロードボタン
  // ========================================
  document.getElementById("downloadBtn").addEventListener("click", () => {
    // ARモード中は一時的に静止画を書き出し
    if (arMode) drawFrame();
    const link = document.createElement("a");
    link.download = "unigorn_ar.png";
    link.href     = canvas.toDataURL("image/png");
    link.click();
  });

  // ========================================
  // 初期化：プリロード完了後に開始
  // ========================================
  window.onload = async () => {
    initCategoryItems();
    initAccordion();

    await preloadAllImages();

    // ローディング非表示
    loadingOverlay.style.display = "none";

    // 静的ループ開始（rAF + isDirty フラグ）
    staticLoop();
    requestDraw();
  };
</script>
</body>
</html>
